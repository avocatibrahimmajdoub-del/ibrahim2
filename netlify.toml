# Site 100 % statique : aucun build, on publie la racine du dépôt.
# install = "" court-circuite `npm install` : sans build, installer sharp (les
# seuls « node_modules » du dépôt) ne sert à rien et allonge chaque déploiement.
[build]
  command = ""
  publish = "."
  install = ""

# Netlify sert automatiquement /en/ et /ar/ (pretty URLs) —
# ces redirections couvrent les variantes sans slash final.
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/ar/index.html"
  status = 200

# 404 personnalisée = vraie page dédiée (noindex), pas l'accueil.
# Évite le « soft-404 » : statut 404 + contenu d'erreur clair + liens de retour.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# URLs non fingerprintées : revalidation systématique sur TOUT /assets.
# (Un cache « immutable » ici figerait anciens CSS, JS et images
#  après chaque mise à jour, puisque les noms de fichiers ne changent pas.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# En-têtes de sécurité/bonnes pratiques sur tout le site.
# Pas de X-Frame-Options ni de CSP frame-ancestors : la preview Arena et la
# carte OpenStreetMap doivent pouvoir intégrer la page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
