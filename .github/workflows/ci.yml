name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static checks (pages, hreflang, ancres, assets, labels)
        run: npm run check

      - name: Pages services à jour (aucune dérive data → HTML)
        run: npm run pages:check

      - name: Score SEO technique (verrouillé à 100/100)
        run: npm run seo:score -- --strict
